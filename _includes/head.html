<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>
    {%- if page.title -%}
      {{ page.title }}
    {%- else -%}
      {{ site.title }}
    {%- endif -%}
  </title>

  {%-seo title=false-%}
  {%-feed_meta-%}
  <!-- Google Fonts: Cormorant Garamond (closest web alternative to ET Book) & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="shortcut icon" type="image/x-icon" href="{{ site.favicon | relative_url }}" />
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.css" integrity="sha384-OH8qNTHoMMVNVcKdKewlipV4SErXqccxxlg6HC9Cwjr5oZu2AdBej1TndeCirael" crossorigin="anonymous">   

  <style>
  /* Style code blocks to match clean technical blog formats */
  pre.highlight, pre {
      background-color: #f7f7f9;
      border: 1px solid #e1e1e8;
      border-radius: 4px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.45;
      overflow-x: auto;
      margin-bottom: 1.5em;
  }

  /* Ensure code text uses a proper monospace font without overriding Tufte body fonts */
  code, kbd, pre, samp {
      font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
  }

  /* Inline code styling override */
  p code, li code {
      background-color: #f7f7f9;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 85%;
  }

  table {
    margin-bottom: 1.4em;
    width: 100%;
    font-size: 0.9em;
    border-collapse: collapse;
    font-family: inherit;
  }

  table th, table td {
      padding: 0.5em 1em 0.5em 0;
      text-align: left;
      vertical-align: top;
  }

  table th {
      font-weight: 600;
      border-bottom: 1px solid #111; /* Dark border under header */
  }

  table td {
      border-bottom: none;
  }

  /* Optional: add a subtle line at the very bottom of the table */
  table tbody tr:last-child td {
      border-bottom: 1px solid #111;
  }

  /* If you use table-striped or want alternating rows to remain clean */
  table tr {
      background: transparent;
  }

  </style>



</head>
